<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Altın Eksper — Kuyumcu Teklif Portalı</title>
<meta name="theme-color" content="#0f172a">
<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
    margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#0f172a; color:#f8fafc; padding:16px;
}
.card{
    background:#1e293b; border:1px solid #334155; border-radius:12px;
    padding:18px; max-width:600px; margin:0 auto 16px; box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.header{
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #334155; padding-bottom:12px; margin-bottom:14px;
}
.brand{ font-size:18px; font-weight:800; color:#f59e0b; }
.timer-badge{
    background:#fee2e2; color:#dc2626; font-weight:800; padding:6px 12px;
    border-radius:20px; font-size:13px; display:inline-flex; align-items:center; gap:5px;
}
.balance-box{
    background:#0f172a; border:1px solid #334155; border-radius:8px;
    padding:10px 14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
}
.item-card{
    background:#0f172a; border:1px solid #334155; border-radius:8px;
    padding:10px; margin-bottom:8px; display:flex; gap:12px; align-items:center;
}
.item-thumb{
    width:56px; height:56px; border-radius:6px; object-fit:cover;
    background:#334155; border:1px solid #475569; cursor:pointer;
}
.price-input{
    width:100%; padding:14px; border-radius:8px; border:2px solid #f59e0b;
    background:#0f172a; color:#fff; font-size:20px; font-weight:800; text-align:center; outline:none; margin-bottom:12px;
}
.submit-btn{
    width:100%; background:linear-gradient(135deg, #f59e0b, #d97706); color:#0f172a;
    border:none; padding:14px; border-radius:8px; font-weight:800; font-size:16px; cursor:pointer;
}
.photo-modal{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85);
    z-index:99999; align-items:center; justify-content:center; padding:20px;
}
</style>
</head>
<body>

<div class="card">
    <div class="header">
        <div>
            <div class="brand">ALTIN EKSPER</div>
            <div style="font-size:12px; color:#94a3b8;">Canlı Satış İhalesi</div>
        </div>
        <div id="countdownTimer" class="timer-badge">⏱ 15:00</div>
    </div>

    <div class="balance-box">
        <div>
            <div style="font-size:11px; color:#94a3b8;">Giriş Yapan Sarraf:</div>
            <strong id="jewelerTitle" style="color:#f8fafc; font-size:13px;">Doğrulanıyor...</strong>
        </div>
        <div id="balanceBadge" style="font-size:12px; font-weight:700; color:#38bdf8;">
            🪙 Yükleniyor...
        </div>
    </div>

    <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">Müşteri İhale Detayı:</div>
    <div id="auctionDetails" style="background:#0f172a; padding:12px; border-radius:8px; border:1px solid #334155; margin-bottom:14px; font-size:13px;">
        Yükleniyor...
    </div>

    <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">Satılacak Ürünler (Fotoğrafa basarak büyütebilirsiniz):</div>
    <div id="itemsContainer"></div>

    <form id="offerForm" onsubmit="handleSendOffer(event)" style="margin-top:16px;">
        <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:6px; text-align:center;">
            Nakit Alış Teklifiniz (Toplam TL):
        </label>
        <input type="number" id="offerPrice" class="price-input" required placeholder="Örn: 85000">
        <input type="text" id="offerNote" placeholder="Varsa notunuz (Örn: Nakit hazır, dükkanda çay ikramı)" 
               style="width:100%; padding:10px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:13px; margin-bottom:12px; outline:none;">
        <button type="submit" id="btnSubmitOffer" class="submit-btn">Teklifi Müşteriye İlet</button>
    </form>
    <div id="offerResult" style="margin-top:12px; font-size:13px; text-align:center; display:none;"></div>
</div>

<!-- FOTOĞRAF BÜYÜTME MODALI -->
<div id="photoModal" class="photo-modal" onclick="this.style.display='none'">
    <img id="bigPhotoImg" src="" style="max-width:100%; max-height:90vh; border-radius:8px;">
</div>

<script>
const BACKEND_API_URL = 'https://altin-eksper.onrender.com/api';
const urlParams = new URLSearchParams(window.location.search);
const reqId = urlParams.get('req') || '';
let loggedJeweler = null;

async function initPortal() {
    let jewelerId = localStorage.getItem('loggedJewelerId');
    if (!jewelerId) {
        jewelerId = prompt("Sarraf / Kuyumcu Kodunuzu Giriniz (Örn: SARRAF_01 veya SARRAF_7206):");
        if (jewelerId) localStorage.setItem('loggedJewelerId', jewelerId.trim().toUpperCase());
    }
    
    if (jewelerId) {
        try {
            const res = await fetch(BACKEND_API_URL + '/jeweler/status/' + jewelerId);
            const data = await res.json();
            if (data.success && data.data) {
                loggedJeweler = data.data;
                document.getElementById('jewelerTitle').textContent = loggedJeweler.name + ' (' + loggedJeweler.id + ')';
                const bBadge = document.getElementById('balanceBadge');
                if (loggedJeweler.membershipType === 'subscription') {
                    bBadge.textContent = '👑 VIP Aylık Sınırsız';
                    bBadge.style.color = '#facc15';
                } else {
                    bBadge.textContent = '🪙 Kalan: ' + (loggedJeweler.credits || 0) + ' Jeton';
                }
            }
        } catch(e) {}
    }

    if (!reqId) {
        document.getElementById('auctionDetails').textContent = 'Geçersiz veya süresi dolmuş ihale linki.';
        return;
    }

    try {
        const res = await fetch(BACKEND_API_URL + '/request/' + reqId);
        const data = await res.json();
        if (data.success && data.data) {
            renderAuction(data.data);
        } else {
            document.getElementById('auctionDetails').innerHTML = '⚠️ Bu ihale sona ermiş veya silinmiş.';
        }
    } catch(e) {
        document.getElementById('auctionDetails').textContent = 'Sunucuya bağlanılamadı.';
    }
}

function renderAuction(req) {
    document.getElementById('auctionDetails').innerHTML = `
        📍 <b>Bölge:</b> ${req.district} &bull; ⚖️ <b>Toplam:</b> ${req.totalGrams} &bull; 🏷 <b>Ref. Değer:</b> ${req.totalReferenceTL}
    `;

    const itemsBox = document.getElementById('itemsContainer');
    itemsBox.innerHTML = (req.items || []).map(it => {
        const imgHtml = it.photo ? `<img src="${it.photo}" class="item-thumb" onclick="openBigPhoto('${it.photo}')">` : `<div class="item-thumb" style="display:flex; align-items:center; justify-content:center; font-size:10px; color:#64748b;">Foto Yok</div>`;
        return `
            <div class="item-card">
                ${imgHtml}
                <div style="flex:1;">
                    <div style="font-weight:700; color:#f8fafc; font-size:14px;">${it.productName} (${it.karat} Ayar)</div>
                    <div style="font-size:12px; color:#94a3b8;">${it.grams ? it.grams + ' g' : ''} ${it.qty ? it.qty + ' adet' : ''}</div>
                </div>
            </div>
        `;
    }).join('');

    startCountdown(req.expiresAt);
}

function startCountdown(expiresAtIso) {
    const expireTime = new Date(expiresAtIso).getTime();
    const tBadge = document.getElementById('countdownTimer');

    const interval = setInterval(() => {
        const diff = expireTime - Date.now();
        if (diff <= 0) {
            clearInterval(interval);
            tBadge.textContent = '⏱ Süre Doldu';
            document.getElementById('offerForm').style.display = 'none';
            return;
        }
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        tBadge.textContent = `⏱ ${(m<10?'0':'')+m}:${(s<10?'0':'')+s}`;
    }, 1000);
}

function openBigPhoto(src) {
    document.getElementById('bigPhotoImg').src = src;
    document.getElementById('photoModal').style.display = 'flex';
}

async function handleSendOffer(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmitOffer');
    const resultBox = document.getElementById('offerResult');
    const offerPrice = Number(document.getElementById('offerPrice').value);
    const offerNote = document.getElementById('offerNote').value.trim();
    const jewelerCode = loggedJeweler ? loggedJeweler.id : (localStorage.getItem('loggedJewelerId') || 'SARRAF');

    btn.disabled = true;
    btn.textContent = 'İletiliyor...';

    try {
        const res = await fetch(BACKEND_API_URL + '/request/quote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestId: reqId, jewelerCode, offerPrice, note: offerNote })
        });
        const data = await res.json();
        if (data.success) {
            resultBox.style.display = 'block';
            resultBox.style.color = '#4ade80';
            resultBox.innerHTML = '✅ <b>Teklifiniz başarıyla müşteriye iletildi!</b><br>Müşteri onaylarsa WhatsApp üzerinden anlık randevu kodu alacaksınız.';
            document.getElementById('offerPrice').disabled = true;
            btn.style.display = 'none';
        } else {
            resultBox.style.display = 'block';
            resultBox.style.color = '#f87171';
            resultBox.textContent = 'Hata: ' + data.message;
            btn.disabled = false;
            btn.textContent = 'Teklifi Müşteriye İlet';
        }
    } catch(err) {
        resultBox.style.display = 'block';
        resultBox.style.color = '#f87171';
        resultBox.textContent = 'Bağlantı hatası oluştu.';
        btn.disabled = false;
        btn.textContent = 'Teklifi Müşteriye İlet';
    }
}

initPortal();
</script>
</body>
</html>
