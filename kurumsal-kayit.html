<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altın Eksper — Kurumsal Sarraf & Kuyumcu Başvurusu</title>
<meta name="theme-color" content="#0f172a">
<style>
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body{
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding: 24px 16px;
}
.wrapper{
    max-width: 860px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    border: 1px solid #e2e8f0;
    overflow: hidden;
}
.header{
    background: #0f172a;
    color: #fff;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1{ margin: 0; font-size: 20px; color: #f59e0b; }
.header p{ margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
.content{ padding: 32px; }
.title-row{
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 12px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.title-row h2{ margin: 0; font-size: 20px; color: #0f172a; }
.title-row a{ font-size: 13px; color: #0284c7; text-decoration: none; font-weight: 600; }

.form-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}
.form-group{ margin-bottom: 16px; }
label{
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
}
input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select{
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: 0.15s;
    background: #fff;
    font-family: inherit;
}
input:focus, select:focus{
    border-color: #0284c7;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
}
.radio-group{
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 8px 0;
}
.radio-item{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
}
.password-wrap{ position: relative; }
.toggle-pass{
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    user-select: none;
    color: #64748b;
}
.consent-box{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 20px 0;
    font-size: 12.5px;
    color: #475569;
}
.btn-submit{
    width: 100%;
    background: #0284c7;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}
.btn-submit:hover{ background: #0369a1; }
.login-link{
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #64748b;
}
.login-link a{ color: #0284c7; font-weight: 700; text-decoration: none; }
@media(max-width: 768px){
    .form-grid{ grid-template-columns: 1fr; gap: 0; }
    .content{ padding: 20px; }
}
</style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div>
            <h1>ALTIN EKSPER</h1>
            <p>Resmi ve Lisanslı Sarrafiye Pazar Yeri Katılım Formu</p>
        </div>
        <a href="/" style="color:#94a3b8; text-decoration:none; font-size:13px; font-weight:600;">← Ana Sayfa</a>
    </div>

    <div class="content">
        <div class="title-row">
            <h2>Kurumsal hesap aç</h2>
            <a href="/giris.html">Zaten hesabın var mı? Giriş yap &gt;</a>
        </div>

        <form id="kurumsalForm" onsubmit="submitKurumsalForm(event)">
            <div class="form-grid">
                <!-- SOL SÜTUN -->
                <div>
                    <div class="form-group">
                        <label>Yetkili Adı *</label>
                        <input type="text" id="kName" placeholder="Adınız" required>
                    </div>

                    <div class="form-group">
                        <label>Yetkili Soyadı *</label>
                        <input type="text" id="kSurname" placeholder="Soyadınız" required>
                    </div>

                    <div class="form-group">
                        <label>Kurumsal E-posta *</label>
                        <input type="email" id="kEmail" placeholder="ornek@kuyumcu.com" required>
                    </div>

                    <div class="form-group">
                        <label>Giriş Şifresi *</label>
                        <div class="password-wrap">
                            <input type="password" id="kPassword" placeholder="En az 6 karakter" required minlength="6">
                            <span class="toggle-pass" onclick="togglePasswordVisibility()">👁</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Sabit / Mağaza Telefonu</label>
                        <input type="tel" id="kLandline" placeholder="0242 XXX XX XX">
                    </div>

                    <div class="form-group">
                        <label>WhatsApp İhale Bildirim Hattı *</label>
                        <input type="tel" id="kPhone" placeholder="05XX XXX XX XX" required>
                    </div>

                    <div class="form-group">
                        <label>Faaliyet Alanınız *</label>
                        <select id="kActivity" required>
                            <option value="">Seçiniz</option>
                            <option value="kuyumcu" selected>Perakende Kuyumculuk & Sarrafiye</option>
                            <option value="imalat">Altın İmalat / Atölye</option>
                            <option value="toptan">Toptan Has & Sarrafiye Ticareti</option>
                            <option value="mucevher">Mücevherat & Pırlanta Mağazası</option>
                        </select>
                    </div>
                </div>

                <!-- SAĞ SÜTUN -->
                <div>
                    <div class="form-group">
                        <label>Mağaza / Firma Ticari Ünvanı *</label>
                        <input type="text" id="kFirmName" placeholder="Örn: Güneş Sarrafiye Ltd. Şti." required>
                    </div>

                    <div class="form-group">
                        <label>İl *</label>
                        <select id="kCity" required onchange="handleCityChange()">
                            <option value="">Seçiniz</option>
                        </select>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="form-group">
                            <label>İlçe *</label>
                            <select id="kDistrict" required>
                                <option value="">Önce İl Seçiniz</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Mahalle / Semt</label>
                            <input type="text" id="kNeighborhood" placeholder="Örn: Şirinyalı Mah.">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>İşletme Türü *</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="companyType" value="sahis" checked onchange="toggleCompanyFields()"> Şahıs şirketi
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="companyType" value="tuzel" onchange="toggleCompanyFields()"> Limited veya Anonim Şirketi
                            </label>
                        </div>
                    </div>

                    <!-- 81 İL VE DİNAMİK VERGİ DAİRESİ SELECT -->
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="form-group">
                            <label>Vergi Dairesi İli *</label>
                            <select id="kTaxCity" required onchange="handleTaxCityChange()">
                                <option value="">İl Seçiniz</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Vergi Dairesi *</label>
                            <select id="kTaxOffice" required>
                                <option value="">Önce İl Seçiniz</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" id="tcknGroup">
                        <label>T.C. Kimlik No *</label>
                        <input type="text" id="kTckn" maxlength="11" placeholder="11 Haneli TCKN">
                    </div>

                    <div class="form-group" id="vknGroup" style="display:none;">
                        <label>Vergi Kimlik No (VKN) *</label>
                        <input type="text" id="kVkn" maxlength="10" placeholder="10 Haneli VKN">
                    </div>
                </div>
            </div>

            <div class="consent-box">
                <input type="checkbox" id="kConsent" required style="margin-top:3px; cursor:pointer;">
                <label for="kConsent" style="margin:0; font-size:12px; cursor:pointer;">
                    Altın Eksper <b>Kurumsal Üyelik Sözleşmesi</b> ve <b>KVKK Açık Rıza Metni</b>'ni okudum, onaylıyorum. Bu sayfadaki bilgilerin doğruluğunu taahhüt ederim.
                </label>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Kurumsal Hesap Aç</button>

            <div class="login-link">
                Zaten hesabın var mı? <a href="/giris.html">Giriş yap &gt;</a>
            </div>
        </form>
    </div>
</div>

<script src="cities.js"></script>
<script>
// ================= 81 İL VERGİ DAİRELERİ REHBERİ =================
const TAX_OFFICES_DATA = {
    "Antalya": ["Muratpaşa V.D.", "Antalya Kurumlar V.D.", "Üçkapılar V.D.", "Düden V.D.", "Alanya V.D.", "Manavgat V.D.", "Kumluca V.D.", "Serik V.D.", "Kemer V.D.", "Kaş V.D.", "Finike V.D.", "Korkuteli V.D.", "Elmalı V.D."],
    "İstanbul": ["Boğaziçi Kurumlar V.D.", "Marmara Kurumlar V.D.", "Beyoğlu V.D.", "Kadıköy V.D.", "Beşiktaş V.D.", "Fatih V.D.", "Şişli V.D.", "Bakırköy V.D.", "Üsküdar V.D.", "Sarıyer V.D.", "Kartal V.D.", "Pendik V.D.", "Ümraniye V.D.", "Maltepe V.D.", "Zeytinburnu V.D.", "Esenler V.D.", "Bağcılar V.D.", "Güngören V.D.", "Gaziosmanpaşa V.D.", "Beylikdüzü V.D.", "Avcılar V.D.", "Büyükçekmece V.D.", "Küçükçekmece V.D.", "Tuzla V.D.", "Sultanbeyli V.D.", "Silivri V.D.", "Çatalca V.D.", "Şile V.D."],
    "Ankara": ["Başkent V.D.", "Ankara Kurumlar V.D.", "Çankaya V.D.", "Kavaklıdere V.D.", "Yenimahalle V.D.", "Keçiören V.D.", "Mamak V.D.", "Altındağ V.D.", "Ulus V.D.", "Sincan V.D.", "Etimesgut V.D.", "Gölbaşı V.D.", "Polatlı V.D.", "Beypazarı V.D.", "Kızılcahamam V.D.", "Çubuk V.D."],
    "İzmir": ["Hasan Tahsin V.D.", "İzmir Kurumlar V.D.", "Konak V.D.", "Karşıyaka V.D.", "Bornova V.D.", "Çiğli V.D.", "Buca V.D.", "Gaziemir V.D.", "Bayraklı V.D.", "Balçova V.D.", "Torbalı V.D.", "Menemen V.D.", "Ödemiş V.D.", "Bergama V.D.", "Tire V.D.", "Aliağa V.D.", "Urla V.D.", "Çeşme V.D."],
    "Bursa": ["Setbaşı V.D.", "Bursa Kurumlar V.D.", "Osmangazi V.D.", "Yıldırım V.D.", "Nilüfer V.D.", "İnegöl V.D.", "Gemlik V.D.", "Mustafakemalpaşa V.D.", "Mudanya V.D.", "Karacabey V.D.", "Orhangazi V.D."],
    "Adana": ["Seyhan V.D.", "Yüreğir V.D.", "Ziyapaşa V.D.", "Beşocak V.D.", "Ceyhan V.D.", "Kozan V.D."],
    "Konya": ["Mevlana V.D.", "Selçuk V.D.", "Meram V.D.", "Alaaddin V.D.", "Ereğli V.D.", "Akşehir V.D.", "Beyşehir V.D."],
    "Gaziantep": ["Şahinbey V.D.", "Şehitkamil V.D.", "Gazikent V.D.", "Suburcu V.D.", "Nizip V.D., İslahiye V.D."],
    "Kayseri": ["Erciyes V.D.", "Gevher Nesibe V.D.", "Mimarsinan V.D.", "Kayseri Kurumlar V.D.", "Develi V.D."],
    "Mersin": ["Uray V.D.", "İstiklal V.D.", "Liman V.D.", "Tarsus V.D.", "Erdemli V.D.", "Silifke V.D.", "Anamur V.D."],
    "Diyarbakır": ["Gökalp V.D.", "Süleyman Nazif V.D.", "Cahit Sıtkı Tarancı V.D.", "Ergani V.D., Bismil V.D."],
    "Eskişehir": ["Battalgazi V.D.", "Taşbaşı V.D.", "2 Eylül V.D.", "Yunus Emre V.D."],
    "Samsun": ["19 Mayıs V.D.", "Gaziler V.D.", "Zafer V.D.", "Bafra V.D.", "Çarşamba V.D."],
    "Denizli": ["Pamukkale V.D.", "Saraylar V.D.", "Gökpınar V.D.", "Çivril V.D."],
    "Şanlıurfa": ["Topçu Meydanı V.D.", "Şanlıurfa V.D.", "Siverek V.D.", "Viranşehir V.D., Birecik V.D."],
    "Kocaeli": ["Alemdar V.D.", "Tepecik V.D.", "Uluçınar V.D.", "Gebze V.D.", "İlyasbey V.D.", "Körfez V.D., Gölcük V.D."],
    "Trabzon": ["Karadeniz V.D.", "Hızırbey V.D.", "Akçaabat V.D., Of V.D."],
    "Balıkesir": ["Karesi V.D.", "Kurtdereli V.D.", "Bandırma V.D.", "Edremit V.D., Ayvalık V.D., Burhaniye V.D."],
    "Aydın": ["Güzelhisar V.D.", "Efeler V.D.", "Nazilli V.D.", "Söke V.D., Kuşadası V.D., Didim V.D."],
    "Tekirdağ": ["Süleymanpaşa V.D.", "Namık Kemal V.D.", "Çorlu V.D.", "Çerkezköy V.D."]
};

const TURKEY_ALL_PROVINCES = [
    "Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir",
    "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli",
    "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari",
    "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir",
    "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Kahramanmaraş", "Mardin", "Muğla", "Muş", "Nevşehir",
    "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat",
    "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman",
    "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"
];

function initRegistrationCities() {
    const citySel = document.getElementById('kCity');
    const taxCitySel = document.getElementById('kTaxCity');

    const sourceList = (typeof TURKEY_CITIES_DATA !== 'undefined' && Object.keys(TURKEY_CITIES_DATA).length > 0)
        ? Object.keys(TURKEY_CITIES_DATA)
        : TURKEY_ALL_PROVINCES;

    citySel.innerHTML = '<option value="">İl Seçiniz</option>';
    taxCitySel.innerHTML = '<option value="">İl Seçiniz</option>';

    sourceList.forEach(c => {
        citySel.innerHTML += `<option value="${c}" ${c === 'Antalya' ? 'selected' : ''}>${c}</option>`;
        taxCitySel.innerHTML += `<option value="${c}" ${c === 'Antalya' ? 'selected' : ''}>${c}</option>`;
    });

    handleCityChange();
    handleTaxCityChange();
}

function handleCityChange() {
    const citySel = document.getElementById('kCity');
    const distSel = document.getElementById('kDistrict');
    if (!citySel || !distSel) return;
    const selectedCity = citySel.value;
    distSel.innerHTML = '<option value="">İlçe Seçiniz</option>';
    if (typeof TURKEY_CITIES_DATA !== 'undefined' && TURKEY_CITIES_DATA[selectedCity]) {
        TURKEY_CITIES_DATA[selectedCity].forEach(d => {
            distSel.innerHTML += `<option value="${d}">${d}</option>`;
        });
    } else {
        distSel.innerHTML = '<option value="Merkez">Merkez</option>';
    }
}

function handleTaxCityChange() {
    const taxCitySel = document.getElementById('kTaxCity');
    const taxOfficeSel = document.getElementById('kTaxOffice');
    if (!taxCitySel || !taxOfficeSel) return;

    const city = taxCitySel.value;
    taxOfficeSel.innerHTML = '<option value="">Vergi Dairesi Seçiniz</option>';

    if (TAX_OFFICES_DATA[city]) {
        TAX_OFFICES_DATA[city].forEach(vd => {
            taxOfficeSel.innerHTML += `<option value="${vd}">${vd}</option>`;
        });
    } else if (city) {
        taxOfficeSel.innerHTML += `<option value="${city} Vergi Dairesi Müdürlüğü" selected>${city} Vergi Dairesi Müdürlüğü</option>`;
        taxOfficeSel.innerHTML += `<option value="${city} Gelir Müdürlüğü">${city} Gelir Müdürlüğü</option>`;
    }
}

function toggleCompanyFields() {
    const type = document.querySelector('input[name="companyType"]:checked').value;
    const tckn = document.getElementById('tcknGroup');
    const vkn = document.getElementById('vknGroup');
    if (type === 'sahis') {
        tckn.style.display = 'block';
        vkn.style.display = 'none';
    } else {
        tckn.style.display = 'none';
        vkn.style.display = 'block';
    }
}

function togglePasswordVisibility() {
    const input = document.getElementById('kPassword');
    input.type = (input.type === 'password') ? 'text' : 'password';
}

async function submitKurumsalForm(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Hesap Oluşturuluyor...';

    const payload = {
        firmName: document.getElementById('kFirmName').value.trim(),
        ownerName: document.getElementById('kName').value.trim() + ' ' + document.getElementById('kSurname').value.trim(),
        email: document.getElementById('kEmail').value.trim(),
        password: document.getElementById('kPassword').value.trim(),
        phone: document.getElementById('kPhone').value.trim(),
        landline: document.getElementById('kLandline').value.trim(),
        city: document.getElementById('kCity').value,
        district: document.getElementById('kDistrict').value,
        neighborhood: document.getElementById('kNeighborhood').value.trim(),
        companyType: document.querySelector('input[name="companyType"]:checked').value,
        taxCity: document.getElementById('kTaxCity').value,
        taxOffice: document.getElementById('kTaxOffice').value,
        taxNo: document.getElementById('kTckn').value.trim() || document.getElementById('kVkn').value.trim(),
        planType: 'token_25'
    };

    try {
        const res = await fetch('/api/jeweler/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            alert('🎉 Tebrikler! Kurumsal kaydınız başarıyla oluşturuldu. 10 deneme jetonunuz tanımlandı.');
            localStorage.setItem('loggedJewelerId', data.jewelerId || payload.phone);
            window.location.href = `/kuyumcu.html?jeweler=${data.jewelerId || payload.phone}`;
        } else {
            alert('Hata: ' + data.message);
            btn.disabled = false;
            btn.textContent = 'Kurumsal Hesap Aç';
        }
    } catch(err) {
        alert('Bağlantı hatası oluştu.');
        btn.disabled = false;
        btn.textContent = 'Kurumsal Hesap Aç';
    }
}

window.onload = initRegistrationCities;
</script>
</body>
</html>
