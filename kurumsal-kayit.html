<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altın Eksper — Kurumsal Sarraf & Kuyumcu Başvurusu</title>
<meta name="theme-color" content="#0f172a">
<style>
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body{
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding: 24px 16px;
}
.wrapper{
    max-width: 860px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    border: 1px solid #e2e8f0;
    overflow: hidden;
}
.header{
    background: #0f172a;
    color: #fff;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1{ margin: 0; font-size: 20px; color: #f59e0b; }
.header p{ margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
.content{ padding: 32px; }
.title-row{
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 12px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.title-row h2{ margin: 0; font-size: 20px; color: #0f172a; }
.title-row a{ font-size: 13px; color: #0284c7; text-decoration: none; font-weight: 600; }

.form-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}
.form-group{ margin-bottom: 16px; }
label{
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
}
input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select{
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: 0.15s;
    background: #fff;
    font-family: inherit;
}
input:focus, select:focus{
    border-color: #0284c7;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
}
.radio-group{
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 8px 0;
}
.radio-item{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
}
.password-wrap{ position: relative; }
.toggle-pass{
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    user-select: none;
    color: #64748b;
}
.consent-box{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 20px 0;
    font-size: 12.5px;
    color: #475569;
}
.consent-box a{
    color: #0284c7;
    text-decoration: underline;
    cursor: pointer;
    font-weight: 600;
}
.btn-submit{
    width: 100%;
    background: #0284c7;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}
.btn-submit:hover{ background: #0369a1; }
.login-link{
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #64748b;
}
.login-link a{ color: #0284c7; font-weight: 700; text-decoration: none; }

/* RESMİ MODAL PENCERESİ */
.modal-backdrop{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.7);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal-box{
    background: #fff;
    max-width: 680px;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    max-height: 85vh;
}
.modal-head{
    padding: 18px 24px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.modal-head h3{ margin: 0; font-size: 17px; color: #0f172a; font-weight: 700; }
.modal-close{
    background: none; border: none; font-size: 22px; color: #64748b; cursor: pointer; line-height: 1;
}
.modal-body{
    padding: 22px 24px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.65;
    color: #334155;
}
.modal-foot{
    padding: 14px 24px;
    border-top: 1px solid #e2e8f0;
    text-align: right;
    background: #f8fafc;
    border-radius: 0 0 12px 12px;
}
.modal-btn{
    background: #0284c7;
    color: #fff;
    border: none;
    padding: 9px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}
.modal-btn:hover{ background: #0369a1; }

@media(max-width: 768px){
    .form-grid{ grid-template-columns: 1fr; gap: 0; }
    .content{ padding: 20px; }
}
</style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div>
            <h1>ALTIN EKSPER</h1>
            <p>Resmi ve Lisanslı Sarrafiye Pazar Yeri Katılım Formu</p>
        </div>
        <a href="/" style="color:#94a3b8; text-decoration:none; font-size:13px; font-weight:600;">← Ana Sayfa</a>
    </div>

    <div class="content">
        <div class="title-row">
            <h2>Kurumsal hesap aç</h2>
            <a href="/giris.html">Zaten hesabın var mı? Giriş yap &gt;</a>
        </div>

        <form id="kurumsalForm" onsubmit="submitKurumsalForm(event)">
            <div class="form-grid">
                <!-- SOL SÜTUN -->
                <div>
                    <div class="form-group">
                        <label>Yetkili Adı *</label>
                        <input type="text" id="kName" placeholder="Adınız" required>
                    </div>

                    <div class="form-group">
                        <label>Yetkili Soyadı *</label>
                        <input type="text" id="kSurname" placeholder="Soyadınız" required>
                    </div>

                    <div class="form-group">
                        <label>Kurumsal E-posta *</label>
                        <input type="email" id="kEmail" placeholder="ornek@kuyumcu.com" required>
                    </div>

                    <div class="form-group">
                        <label>Giriş Şifresi *</label>
                        <div class="password-wrap">
                            <input type="password" id="kPassword" placeholder="En az 6 karakter" required minlength="6">
                            <span class="toggle-pass" onclick="togglePasswordVisibility()">👁</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Sabit / Mağaza Telefonu</label>
                        <input type="tel" id="kLandline" placeholder="0XXX XXX XX XX">
                    </div>

                    <div class="form-group">
                        <label>WhatsApp İhale Bildirim Hattı *</label>
                        <input type="tel" id="kPhone" placeholder="05XX XXX XX XX" required>
                    </div>

                    <div class="form-group">
                        <label>Faaliyet Alanınız *</label>
                        <select id="kActivity" required>
                            <option value="">Seçiniz</option>
                            <option value="kuyumcu" selected>Perakende Kuyumculuk & Sarrafiye</option>
                            <option value="imalat">Altın İmalat / Atölye</option>
                            <option value="toptan">Toptan Has & Sarrafiye Ticareti</option>
                            <option value="mucevher">Mücevherat & Pırlanta Mağazası</option>
                        </select>
                    </div>
                </div>

                <!-- SAĞ SÜTUN -->
                <div>
                    <div class="form-group">
                        <label>Mağaza / Firma Ticari Ünvanı *</label>
                        <input type="text" id="kFirmName" placeholder="Örn: Güneş Sarrafiye Ltd. Şti." required>
                    </div>

                    <div class="form-group">
                        <label>İl *</label>
                        <select id="kCity" required onchange="handleCityChange()">
                            <option value="">İl Seçiniz</option>
                        </select>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="form-group">
                            <label>İlçe *</label>
                            <select id="kDistrict" required>
                                <option value="">Önce İl Seçiniz</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Mahalle / Semt</label>
                            <input type="text" id="kNeighborhood" placeholder="Örn: Şirinyalı Mah.">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>İşletme Türü *</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="companyType" value="sahis" checked onchange="toggleCompanyFields()"> Şahıs şirketi
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="companyType" value="tuzel" onchange="toggleCompanyFields()"> Limited veya Anonim Şirketi
                            </label>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="form-group">
                            <label>Vergi Dairesi İli *</label>
                            <select id="kTaxCity" required onchange="handleTaxCityChange()">
                                <option value="">İl Seçiniz</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Vergi Dairesi *</label>
                            <select id="kTaxOffice" required>
                                <option value="">Önce İl Seçiniz</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" id="tcknGroup">
                        <label>T.C. Kimlik No *</label>
                        <input type="text" id="kTckn" maxlength="11" placeholder="11 Haneli TCKN">
                    </div>

                    <div class="form-group" id="vknGroup" style="display:none;">
                        <label>Vergi Kimlik No (VKN) *</label>
                        <input type="text" id="kVkn" maxlength="10" placeholder="10 Haneli VKN">
                    </div>
                </div>
            </div>

            <div class="consent-box">
                <input type="checkbox" id="kConsent" required style="margin-top:3px; cursor:pointer;">
                <label for="kConsent" style="margin:0; font-size:12px; cursor:pointer;">
                    Altın Eksper <a onclick="openLegalModal('sozlesme')">Kurumsal Üyelik Sözleşmesi</a> ve <a onclick="openLegalModal('kvkk')">KVKK Açık Rıza Metni</a>'ni okudum, onaylıyorum. Bu sayfadaki bilgilerin doğruluğunu taahhüt ederim.
                </label>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Kurumsal Hesap Aç</button>

            <div class="login-link">
                Zaten hesabın var mı? <a href="/giris.html">Giriş yap &gt;</a>
            </div>
        </form>
    </div>
</div>

<!-- SÖZLEŞME VE KVKK PENCERESİ -->
<div id="legalModal" class="modal-backdrop">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="modalTitle">Bilgilendirme</h3>
            <button type="button" class="modal-close" onclick="closeLegalModal()">✕</button>
        </div>
        <div class="modal-body" id="modalContent"></div>
        <div class="modal-foot">
            <button type="button" class="modal-btn" onclick="closeLegalModal()">Okudum, Anladım</button>
        </div>
    </div>
</div>

<script src="cities.js"></script>
<script>
const TAX_OFFICES_DATA = {
    "Antalya": ["Muratpaşa V.D.", "Antalya Kurumlar V.D.", "Üçkapılar V.D.", "Düden V.D.", "Alanya V.D.", "Manavgat V.D.", "Kumluca V.D.", "Serik V.D.", "Kemer V.D.", "Kaş V.D.", "Finike V.D.", "Korkuteli V.D.", "Elmalı V.D."],
    "İstanbul": ["Boğaziçi Kurumlar V.D.", "Marmara Kurumlar V.D.", "Beyoğlu V.D.", "Kadıköy V.D.", "Beşiktaş V.D.", "Fatih V.D.", "Şişli V.D.", "Bakırköy V.D.", "Üsküdar V.D.", "Sarıyer V.D.", "Kartal V.D.", "Pendik V.D.", "Ümraniye V.D.", "Maltepe V.D.", "Zeytinburnu V.D.", "Esenler V.D.", "Bağcılar V.D.", "Güngören V.D.", "Gaziosmanpaşa V.D.", "Beylikdüzü V.D.", "Avcılar V.D.", "Büyükçekmece V.D.", "Küçükçekmece V.D.", "Tuzla V.D.", "Sultanbeyli V.D."],
    "Ankara": ["Başkent V.D.", "Ankara Kurumlar V.D.", "Çankaya V.D.", "Kavaklıdere V.D.", "Yenimahalle V.D.", "Keçiören V.D.", "Mamak V.D.", "Altındağ V.D.", "Ulus V.D.", "Sincan V.D.", "Etimesgut V.D.", "Gölbaşı V.D.", "Polatlı V.D."],
    "İzmir": ["Hasan Tahsin V.D.", "İzmir Kurumlar V.D.", "Konak V.D.", "Karşıyaka V.D.", "Bornova V.D.", "Çiğli V.D.", "Buca V.D.", "Gaziemir V.D.", "Bayraklı V.D.", "Balçova V.D.", "Torbalı V.D.", "Menemen V.D.", "Ödemiş V.D.", "Bergama V.D.", "Aliağa V.D.", "Çeşme V.D."],
    "Bursa": ["Setbaşı V.D.", "Bursa Kurumlar V.D.", "Osmangazi V.D.", "Yıldırım V.D.", "Nilüfer V.D.", "İnegöl V.D.", "Gemlik V.D.", "Mudanya V.D."],
    "Adana": ["Seyhan V.D.", "Yüreğir V.D.", "Ziyapaşa V.D.", "Beşocak V.D.", "Ceyhan V.D."],
    "Konya": ["Mevlana V.D.", "Selçuk V.D.", "Meram V.D.", "Alaaddin V.D.", "Ereğli V.D."],
    "Gaziantep": ["Şahinbey V.D.", "Şehitkamil V.D.", "Gazikent V.D.", "Suburcu V.D.", "Nizip V.D."],
    "Kayseri": ["Erciyes V.D.", "Gevher Nesibe V.D.", "Mimarsinan V.D.", "Kayseri Kurumlar V.D."],
    "Mersin": ["Uray V.D.", "İstiklal V.D.", "Liman V.D.", "Tarsus V.D.", "Silifke V.D."],
    "Kocaeli": ["Alemdar V.D.", "Tepecik V.D.", "Uluçınar V.D.", "Gebze V.D.", "Körfez V.D."]
};

const TURKEY_ALL_PROVINCES = [
    "Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir",
    "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli",
    "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari",
    "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir",
    "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Kahramanmaraş", "Mardin", "Muğla", "Muş", "Nevşehir",
    "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat",
    "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman",
    "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"
];

function initRegistrationCities() {
    const citySel = document.getElementById('kCity');
    const taxCitySel = document.getElementById('kTaxCity');

    const sourceList = (typeof TURKEY_CITIES_DATA !== 'undefined' && Object.keys(TURKEY_CITIES_DATA).length > 0)
        ? Object.keys(TURKEY_CITIES_DATA)
        : TURKEY_ALL_PROVINCES;

    citySel.innerHTML = '<option value="">İl Seçiniz</option>';
    taxCitySel.innerHTML = '<option value="">İl Seçiniz</option>';

    sourceList.forEach(c => {
        citySel.innerHTML += `<option value="${c}">${c}</option>`;
        taxCitySel.innerHTML += `<option value="${c}">${c}</option>`;
    });

    document.getElementById('kDistrict').innerHTML = '<option value="">Önce İl Seçiniz</option>';
    document.getElementById('kTaxOffice').innerHTML = '<option value="">Önce İl Seçiniz</option>';
}

function handleCityChange() {
    const citySel = document.getElementById('kCity');
    const distSel = document.getElementById('kDistrict');
    const selectedCity = citySel.value;

    if (!selectedCity) {
        distSel.innerHTML = '<option value="">Önce İl Seçiniz</option>';
        return;
    }

    distSel.innerHTML = '<option value="">İlçe Seçiniz</option>';
    if (typeof TURKEY_CITIES_DATA !== 'undefined' && TURKEY_CITIES_DATA[selectedCity]) {
        TURKEY_CITIES_DATA[selectedCity].forEach(d => {
            distSel.innerHTML += `<option value="${d}">${d}</option>`;
        });
    } else {
        distSel.innerHTML += '<option value="Merkez">Merkez</option>';
    }
}

function handleTaxCityChange() {
    const taxCitySel = document.getElementById('kTaxCity');
    const taxOfficeSel = document.getElementById('kTaxOffice');
    const city = taxCitySel.value;

    if (!city) {
        taxOfficeSel.innerHTML = '<option value="">Önce İl Seçiniz</option>';
        return;
    }

    taxOfficeSel.innerHTML = '<option value="">Vergi Dairesi Seçiniz</option>';
    if (TAX_OFFICES_DATA[city]) {
        TAX_OFFICES_DATA[city].forEach(vd => {
            taxOfficeSel.innerHTML += `<option value="${vd}">${vd}</option>`;
        });
    } else {
        taxOfficeSel.innerHTML += `<option value="${city} Vergi Dairesi Müdürlüğü">${city} Vergi Dairesi Müdürlüğü</option>`;
        taxOfficeSel.innerHTML += `<option value="${city} Malmüdürlüğü">${city} Malmüdürlüğü</option>`;
    }
}

function toggleCompanyFields() {
    const type = document.querySelector('input[name="companyType"]:checked').value;
    const tckn = document.getElementById('tcknGroup');
    const vkn = document.getElementById('vknGroup');
    if (type === 'sahis') {
        tckn.style.display = 'block';
        vkn.style.display = 'none';
    } else {
        tckn.style.display = 'none';
        vkn.style.display = 'block';
    }
}

function togglePasswordVisibility() {
    const input = document.getElementById('kPassword');
    input.type = (input.type === 'password') ? 'text' : 'password';
}

function openLegalModal(type) {
    const modal = document.getElementById('legalModal');
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');

    if (type === 'sozlesme') {
        title.textContent = 'Altın Eksper — Kurumsal Sarraf İş Ortaklığı Sözleşmesi';
        content.innerHTML = `
            <h4 style="margin:0 0 6px; color:#0f172a; font-size:13.5px;">1. TARAFLAR VE SÖZLEŞMENİN AMACI</h4>
            <p>İşbu Kurumsal Sarraf İş Ortaklığı Sözleşmesi ("Sözleşme"), Altın Eksper Dijital Bilgi ve Aracılık Platformu ("Platform") ile işbu platform üzerinden kurumsal üyelik tesis eden yetkili sarrafiye, kuyumculuk ve kıymetli maden ticareti işletmesi ("Üye Sarraf") arasında akdedilmiştir. Sözleşmenin amacı; platform vasıtasıyla nihai tüketicilerin satışa sunduğu ziynet, hurda ve has altın emtiası için güvenli, şeffaf, rekabetçi bir ihale ortamı tesis edilmesi ve tarafların hak/yükümlülüklerinin belirlenmesidir.</p>

            <h4 style="margin:12px 0 6px; color:#0f172a; font-size:13.5px;">2. TEKLİF AHLAKI, TAAHHÜT VE BAĞLAYICILIK</h4>
            <p>Üye Sarraf, platform sistemi üzerinden tüketiciye ilettiği nakit alım teklifinin piyasa etiğine uygun ve bağlayıcı bir irade beyanı olduğunu kabul eder. Müşterinin bildirdiği ürün ayarı ve gramaj beyanının mağaza içinde yapılan hassas terazi tartımı ve mihenk taşı/ayar testi ile doğrulanması kaydıyla, sarraf teklif ettiği toplam bedeli eksiksiz olarak (nakit veya anlık FAST/havale transferi ile) müşteriye ödemekle yükümlüdür. Ürün niteliklerinde eksiklik, düşük ayar veya imitasyon tespiti hali müstesna olmak üzere, keyfi fiyat kırma ve tekliften dönme platform kurallarının ihlali sayılır.</p>

            <h4 style="margin:12px 0 6px; color:#0f172a; font-size:13.5px;">3. GÜVENLİK KODU (PIN) VE İŞLEM DOĞRULAMA</h4>
            <p>Platform dışı kayıt dışı işlemlerin ("kaçak işlem") önüne geçilmesi, tüketici ve esnaf mağduriyetlerinin engellenmesi amacıyla her randevu için müşteriye özel 4 haneli Güvenlik PIN Kodu üretilir. Üye Sarraf, fiziki mağazasında alım işlemini sonlandırırken müşteriden bu kodu talep ederek sisteme işlemek zorundadır. Kodu girilmeyen veya teyit edilmeyen işlemler platform güvencesi kapsamı dışında kalır.</p>

            <h4 style="margin:12px 0 6px; color:#0f172a; font-size:13.5px;">4. BAŞARI JETONU VE KOMİSYON TARİFESİ</h4>
            <p>Sistemde başarı kesintisi yalnızca müşteri mağazaya fiilen gelip satış kesinleştiğinde uygulanır. Başarı komisyonu; Bilezik, 22 Ayar Hurda ve 24 Ayar Gram Has altınlarda binde bir (‰1), diğer ziynet ve fantezi ürünlerde binde iki (‰2) olarak hesaplanır ve sarrafın jeton bakiyesinden mahsup edilir. Müşterinin mağazaya gelmediği ("No-Show") veya vazgeçtiği teyit edilen durumlarda Üye Sarraftan hiçbir jeton veya bedel tahsil edilmez.</p>

            <h4 style="margin:12px 0 6px; color:#0f172a; font-size:13.5px;">5. VERİ GİZLİLİĞİ VE İLETİŞİM GÜVENLİĞİ</h4>
            <p>Üye Sarraf, ihale ve randevu süreci kapsamında tarafına iletilen tüketiciye ait isim, telefon ve konum verilerini münhasıran ilgili işlem için kullanacağını; hiçbir surette üçüncü kişilere devretmeyeceğini, ticari reklam/pazarlama amacıyla veri tabanına kaydetmeyeceğini taahhüt eder. Aksi davranışlar KVKK ve TCK kapsamında doğrudan Üye Sarrafın cezai sorumluluğundadır.</p>

            <h4 style="margin:12px 0 6px; color:#0f172a; font-size:13.5px;">2. İŞLENEN KİŞİSEL VERİ KATEGORİLERİ</h4>
            <p>Kurumsal hesap oluşturma ve sistem kullanımı esnasında tarafınızca paylaşılan;

            <h4 style="margin:12px 0 6px; color:#0f172a; font-size:13.5px;">3. KİŞİSEL VERİ İŞLEME AMAÇLARI VE HUKUKİ SEBEPLERİ</h4>

            <h4 style="margin:12px 0 6px; color:#0f172a; font-size:13.5px;">5. KVKK'NIN 11. MADDESİ KAPSAMINDAKİ HAKLARINIZ</h4>

async function submitKurumsalForm(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Hesap Oluşturuluyor...';

    const payload = {
        firmName: document.getElementById('kFirmName').value.trim(),
        ownerName: document.getElementById('kName').value.trim() + ' ' + document.getElementById('kSurname').value.trim(),
        email: document.getElementById('kEmail').value.trim(),
        password: document.getElementById('kPassword').value.trim(),
        phone: document.getElementById('kPhone').value.trim(),
        landline: document.getElementById('kLandline').value.trim(),
        city: document.getElementById('kCity').value,
        district: document.getElementById('kDistrict').value,
        neighborhood: document.getElementById('kNeighborhood').value.trim(),
        companyType: document.querySelector('input[name="companyType"]:checked').value,
        taxCity: document.getElementById('kTaxCity').value,
        taxOffice: document.getElementById('kTaxOffice').value,
        taxNo: document.getElementById('kTckn').value.trim() || document.getElementById('kVkn').value.trim(),
        planType: 'token_25'
    };

    try {
        const res = await fetch('/api/jeweler/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            alert('🎉 Tebrikler! Kurumsal kaydınız başarıyla oluşturuldu. 10 deneme jetonunuz tanımlandı.');
            localStorage.setItem('loggedJewelerId', data.jewelerId || payload.phone);
            window.location.href = `/kuyumcu.html?jeweler=${data.jewelerId || payload.phone}`;
        } else {
            alert('Hata: ' + data.message);
            btn.disabled = false;
            btn.textContent = 'Kurumsal Hesap Aç';
        }
    } catch(err) {
        alert('Bağlantı hatası oluştu.');
        btn.disabled = false;
        btn.textContent = 'Kurumsal Hesap Aç';
    }
}
